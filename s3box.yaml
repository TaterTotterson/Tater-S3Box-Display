substitutions:
  device_name: taters3box
  friendly_name: taterS3Box
  tater_first_name: Tater
  display_target: livingroom

  # Point this at the Tater host running the voice/display API.
  tater_base_url: http://tater.local:8501
  tater_token: ""
  timezone: America/Chicago

  # Wi-Fi / OTA target
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  device_ip: 10.4.20.237

  # Tater display feed slots. These are Home Assistant entity ids already known to Tater.
  sensor_temp_out: sensor.weather_outdoor_temperature
  sensor_temp_in: sensor.living_room_temperature
  sensor_humidity_out: sensor.humidity
  sensor_humidity_in: sensor.up_sense_humidity_level
  sensor_wind_speed: sensor.wind_speed
  sensor_rain_rate: sensor.rain_rate
  sensor_lightning_strikes: sensor.weather_lightning_strikes

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%
      - script.execute: refresh_clock

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  use_address: ${device_ip}
  reboot_timeout: 0s
  ap:
  on_connect:
    then:
      - text_sensor.template.publish:
          id: connection_status_text
          state: "Wi-Fi online"
      - script.execute: fetch_tater_feed
      - script.execute: fetch_tater_events
  on_disconnect:
    then:
      - text_sensor.template.publish:
          id: connection_status_text
          state: "Wi-Fi offline"

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

captive_portal:

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - script.execute: refresh_clock
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: refresh_clock

json:

http_request:
  timeout: 2s
  verify_ssl: false

spi:
  - id: spi_bus
    clk_pin: GPIO7
    mosi_pin: GPIO6

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: lcd_backlight
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 120ms

globals:
  - id: last_event_seq
    type: int
    restore_value: no
    initial_value: "0"
  - id: event_visible
    type: bool
    restore_value: no
    initial_value: "false"
  - id: event_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: tool_animation_frame
    type: int
    restore_value: no
    initial_value: "0"

font:
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_14
    size: 14
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_16
    size: 16
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_18
    size: 18
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_24
    size: 24
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_36
    size: 36
  - file:
      type: gfonts
      family: Roboto Mono
    id: tater_font_56
    size: 56

text_sensor:
  - platform: template
    id: connection_status_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: status_label
            text: !lambda return x;

  - platform: template
    id: temp_out_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: temp_out_value
            text: !lambda return x;

  - platform: template
    id: temp_in_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: temp_in_value
            text: !lambda return x;

  - platform: template
    id: humidity_out_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: humidity_out_value
            text: !lambda return x;

  - platform: template
    id: humidity_in_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: humidity_in_value
            text: !lambda return x;

  - platform: template
    id: wind_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: wind_value
            text: !lambda return x;

  - platform: template
    id: rain_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: rain_value
            text: !lambda return x;

  - platform: template
    id: lightning_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lightning_value
            text: !lambda return x;

  - platform: template
    id: event_kind_text
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: return x == "tool_call";
            then:
              - lvgl.page.show: tool_page
            else:
              - lvgl.page.show: event_page

  - platform: template
    id: event_title_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: event_title_label
            text: !lambda return x;

  - platform: template
    id: event_message_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: event_message_label
            text: !lambda return x;
        - lvgl.label.update:
            id: tool_message_label
            text: !lambda return x;

  - platform: template
    id: event_description_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: event_description_label
            text: !lambda return x;

  - platform: template
    id: event_priority_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: event_priority_label
            text: !lambda return x;

  - platform: template
    id: tool_name_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: tool_name_label
            text: !lambda return x;

  - platform: template
    id: tool_step_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: tool_step_label
            text: !lambda return x;

script:
  - id: refresh_clock
    mode: restart
    then:
      - lvgl.label.update:
          id: clock_label
          text:
            time_format: "%I:%M"
            time: local_time
      - lvgl.label.update:
          id: date_label
          text:
            time_format: "%a %b %d"
            time: local_time

  - id: fetch_tater_feed
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            return std::string("${tater_base_url}/tater-ha/v1/display/feed")
              + "?target=${display_target}"
              + "&selector=${display_target}"
              + "&temp_out=${sensor_temp_out}"
              + "&temp_in=${sensor_temp_in}"
              + "&humidity_out=${sensor_humidity_out}"
              + "&humidity_in=${sensor_humidity_in}"
              + "&wind_speed=${sensor_wind_speed}"
              + "&rain_rate=${sensor_rain_rate}"
              + "&lightning_strikes=${sensor_lightning_strikes}";
          request_headers:
            X-Tater-Token: "${tater_token}"
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - text_sensor.template.publish:
                        id: connection_status_text
                        state: "Tater online"
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          JsonObject text = root["text"].as<JsonObject>();
                          id(temp_out_text).publish_state(text["temp_out"] | "--");
                          id(temp_in_text).publish_state(text["temp_in"] | "--");
                          id(humidity_out_text).publish_state(text["humidity_out"] | "--");
                          id(humidity_in_text).publish_state(text["humidity_in"] | "--");
                          id(wind_text).publish_state(text["wind_speed"] | "--");
                          id(rain_text).publish_state(text["rain_rate"] | "--");
                          id(lightning_text).publish_state(text["lightning_strikes"] | "--");
                          return true;
                        });
                  else:
                    - text_sensor.template.publish:
                        id: connection_status_text
                        state: "Tater offline"
          on_error:
            then:
              - text_sensor.template.publish:
                  id: connection_status_text
                  state: "Tater offline"

  - id: fetch_tater_events
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            return std::string("${tater_base_url}/tater-ha/v1/display/events")
              + "?target=${display_target}"
              + "&after_seq=" + std::to_string(id(last_event_seq))
              + "&limit=4";
          request_headers:
            X-Tater-Token: "${tater_token}"
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          int last_seq = root["last_seq"] | id(last_event_seq);
                          if (last_seq > id(last_event_seq)) {
                            id(last_event_seq) = last_seq;
                          }

                          JsonArray events = root["events"].as<JsonArray>();
                          if (events.size() == 0) {
                            return true;
                          }

                          JsonObject event = events[events.size() - 1].as<JsonObject>();
                          const char *kind = event["kind"] | "notification";
                          const char *title = event["title"] | "";
                          const char *message = event["message"] | "";
                          const char *description = event["description"] | "";
                          const char *priority = event["priority"] | "normal";
                          const char *tool = event["tool"] | "";
                          int step_index = event["step_index"] | 0;
                          int step_total = event["step_total"] | 0;
                          int ttl = event["ttl_seconds"] | 18;

                          std::string kind_text = kind == nullptr ? "notification" : std::string(kind);
                          if (title == nullptr || title[0] == '\0') {
                            title = kind_text == "tool_call" ? "Tool Call" : "${tater_first_name}";
                          }
                          if ((message == nullptr || message[0] == '\0') && description != nullptr) {
                            message = description;
                          }

                          id(event_title_text).publish_state(title);
                          id(event_message_text).publish_state(message == nullptr ? "" : message);
                          id(event_description_text).publish_state(description == nullptr ? "" : description);
                          id(event_priority_text).publish_state(priority == nullptr ? "normal" : priority);
                          id(tool_name_text).publish_state(
                            tool != nullptr && tool[0] != '\0' ? tool : "${tater_first_name} is working"
                          );

                          static char step_buf[16];
                          if (step_index > 0 && step_total > 0) {
                            snprintf(step_buf, sizeof(step_buf), "%d/%d", step_index, step_total);
                          } else {
                            snprintf(step_buf, sizeof(step_buf), "running");
                          }
                          id(tool_step_text).publish_state(step_buf);

                          id(event_visible) = true;
                          if (ttl < 6) {
                            ttl = 6;
                          }
                          if (ttl > 90) {
                            ttl = 90;
                          }
                          id(event_until_ms) = millis() + (uint32_t) ttl * 1000U;
                          id(event_kind_text).publish_state(kind);
                          return true;
                        });

  - id: animate_tool_call
    mode: restart
    then:
      - lambda: |-
          id(tool_animation_frame) = (id(tool_animation_frame) + 1) % 6;
      - lvgl.label.update:
          id: tool_motion_label
          text: !lambda |-
            static const char * const frames[] = {
              "o                o",
              "  o            o  ",
              "    o        o    ",
              "      o    o      ",
              "        oo        ",
              "      o    o      "
            };
            return frames[id(tool_animation_frame)];

interval:
  - interval: 1s
    then:
      - script.execute: refresh_clock
      - if:
          condition:
            lambda: return id(event_visible) && id(event_until_ms) != 0 && millis() > id(event_until_ms);
          then:
            - lambda: |-
                id(event_visible) = false;
                id(event_until_ms) = 0;
            - lvgl.page.show: home_page
      - if:
          condition:
            lambda: return id(event_visible) && id(event_kind_text).state == "tool_call";
          then:
            - script.execute: animate_tool_call

  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: fetch_tater_feed

  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: fetch_tater_events

display:
