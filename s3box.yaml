    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

